<!-- Wazuh agent on lab-pc-01: the single monitored host of the CampusShield lab. -->
<ossec_config>
  <client>
    <server>
      <address>172.25.0.4</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>lab-pc-01</agent_name>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- SSH (dropbear) logins and failures, via busybox syslogd -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- File integrity: system accounts and the anonymous FTP share, in real time -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>
    <!-- real-time monitoring watches directories, so /etc is watched, limited to the account files -->
    <directories realtime="yes" check_all="yes" restrict="^/etc/passwd$|^/etc/shadow$|^/etc/group$">/etc</directories>
    <directories realtime="yes" check_all="yes">/var/ftp</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
  </syscheck>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <sca>
    <enabled>no</enabled>
  </sca>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>
</ossec_config>
