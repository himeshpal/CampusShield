[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs the running Docker lab network (run inside the backend container)"]

[tool.ruff]
line-length = 100
target-version = "py312"
# generated migrations stay exactly as applied
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
